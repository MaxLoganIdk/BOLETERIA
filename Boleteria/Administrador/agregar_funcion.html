<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar funcion</title>
</head>

<body>

    <a href="admin.html">Volver al panel</a>

    <h1>AGREGAR NUEVA FUNCION</h1>

    <p>
        Selecciona la pelicula: <br>
        <select>
            <option>Coyote vs Acme</option>
            <option>Doom</option>
            <option>Resident</option>
  
        </select>
    </p>

    <p>
        Dia: <br>
        <select>
            <option>Lunes</option>
            <option>Martes</option>
            <option>Miercoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
            <option>Sabado</option>
            <option>Domingo</option>
        </select>
    </p>

    <p>
        Horario: <br>
        <input type="time">
    </p>

    <p>
        Sala: <br>
        <select>
            <option>Sala 1</option>
            <option>Sala 2</option>
            <option>Sala 3</option>
        </select>
    </p>

    <p>
        Precio por entrada (S/): <br>
        <input type="text" placeholder="Ej: 15.00">
    </p>

    <br>
    <a href="admin.html">
        <button type="button">GUARDAR FUNCION</button>
    </a>

</body>

</html>

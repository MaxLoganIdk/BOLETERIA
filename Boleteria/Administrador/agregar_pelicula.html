<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar pelicula</title>
</head>

<body>

    <a href="admin.html">Volver al panel</a>

    <h1>AGREGAR NUEVA PELICULA</h1>

    <p>
        Nombre de la pelicula: <br>
        <input type="text" placeholder="Ej: Coyote vs Acme">
    </p>

    <p>
        Imagen (nombre del archivo): <br>
        <input type="text" placeholder="Ej: coyote.jpg">
    </p>

    <p>
        Duracion: <br>
        <input type="text" placeholder="Ej: 1H 44M">
    </p>

    <p>
        Clasificacion: <br>
        <select>
            <option>Apto para todo publico</option>
            <option>+14</option>
            <option>+18</option>
        </select>
    </p>

    <p>
        Sinopsis: <br>
        <textarea rows="4" cols="40" placeholder="Escribe una breve descripcion de la pelicula"></textarea>
    </p>

    <br>
    <a href="admin.html">
        <button type="button">GUARDAR PELICULA</button>
    </a>

</body>

</html>
